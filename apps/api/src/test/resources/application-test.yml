spring:
  datasource:
    url: jdbc:h2:mem:kassa-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

kassa:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256-testing

logging:
  level:
    com.kassa: DEBUG
