spring:
  application:
    name: kassa-api
  profiles:
    active: ${APP_ENV:dev}

  datasource:
    url: jdbc:h2:mem:kassa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    clean-on-validation-error: false

server:
  port: 8080
  servlet:
    context-path: /

kassa:
  cookie:
    secure: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_RPM:10}
  jwt:
    secret: ${JWT_SECRET:kassa-dev-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.kassa: DEBUG
    org.springframework.security: DEBUG
