services:
  - type: web
    name: kassa-api
    image:
      context: ./apps/api
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kassa-gamma.vercel.app
      - key: DB_HOST
        fromDatabase:
          name: kassa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kassa-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kassa-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kassa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kassa-db
          property: password

databases:
  - name: kassa-db
    engine: postgres
    version: "16"
    plan: free
