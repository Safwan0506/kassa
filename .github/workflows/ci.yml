name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Tests (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kassa_test
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kassa"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API tests
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kassa_test
          DB_USER: kassa
          DB_PASSWORD: kassa_test
        run: ./mvnw verify --batch-mode --no-transfer-progress

  web-tests:
    name: Web Tests (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Run tests
        working-directory: apps/web
        run: npm test -- --run
